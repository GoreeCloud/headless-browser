name: GoreeCloud source import validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-and-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # Verify both imported ancestor histories without executing source
      - name: Self-test provenance and workflow gate
        run: python3 -m unittest discover -s tests/goreecloud -p "test_*.py" -v
      - name: Check Cargo binary registration (manifest only, no build scripts)
        run: python3 scripts/verify_cargo_targets.py
      - name: Inspect locked dependency sources without fetching or compiling
        run: python3 scripts/inventory_cargo_lock.py
      - name: Verify unchanged imported graphics without assuming license clearance
        run: python3 scripts/verify_imported_assets.py
      - name: Inspect nonpublishing container source security policy
        run: python3 scripts/verify_container_source_policy.py
      - name: Test dependency-free CLI identity code (no upstream build scripts)
        run: |
          rustc --edition=2021 --test crates/obscura-cli/src/brand.rs -o "$RUNNER_TEMP/goreecloud-brand-tests"
          "$RUNNER_TEMP/goreecloud-brand-tests"
      - name: Test isolated SSRF address policy without dependencies or network
        run: |
          rustc --edition=2021 --test crates/obscura-ssrf/src/lib.rs -o "$RUNNER_TEMP/goreecloud-ssrf-address-tests"
          "$RUNNER_TEMP/goreecloud-ssrf-address-tests"
      - name: Validate attributed import without executing upstream code
        run: python3 scripts/verify_goreecloud_import.py

  cli-typecheck:
    # A disposable hosted runner only; the provenance job must first pass.
    needs: provenance-and-branding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed source without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select pinned stable Rust setup action
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Check SSRF library with inherited tests
        run: cargo test --locked -p obscura-ssrf
      - name: Typecheck all default-feature CLI binaries without releasing
        run: cargo check --locked -p obscura-cli --bins --no-default-features
      - name: Exercise targeted CDP malformed-Host rejection test
        run: |
          cargo test --locked -p obscura-cdp --lib rejects_host_header_userinfo_and_url_components -- --nocapture | tee "$RUNNER_TEMP/cdp-host-authority-test.log"
          grep -E "test result: ok\. 1 passed; 0 failed" "$RUNNER_TEMP/cdp-host-authority-test.log"
      - name: Reject duplicate Host, Origin and Authorization header fields
        run: |
          cargo test --locked -p obscura-cdp --lib rejects_duplicate_sensitive_http_headers -- --nocapture | tee "$RUNNER_TEMP/cdp-duplicate-header-test.log"
          grep -E "test result: ok\. 1 passed; 0 failed" "$RUNNER_TEMP/cdp-duplicate-header-test.log"
      - name: Verify CDP commands and private initialization use structured JSON
        run: |
          cargo test --locked -p obscura-cdp --lib browser_close_only_matches_the_exact_protocol_method -- --nocapture
          cargo test --locked -p obscura-cdp --lib connection_init_filter_does_not_swallow_user_response_data -- --nocapture
      - name: Check inbound WebSocket frame and message memory budgets
        run: cargo test --locked -p obscura-cdp --lib websocket_config_caps_inbound_frames_and_messages -- --nocapture
      - name: Verify exact CDP HTTP discovery routing without header injection
        run: cargo test --locked -p obscura-cdp --lib discovery_router_uses_only_exact_http_request_targets -- --nocapture
      - name: Build local-only unpublished CLI executables
        run: cargo build --locked -p obscura-cli --bins --no-default-features
      - name: Verify both commands and SSRF on a disposable owned-loopback fixture
        run: python3 scripts/verify_cli_loopback_smoke.py
      - name: Verify loopback CDP discovery and HTTP auth/authority controls
        run: python3 scripts/verify_cdp_loopback_smoke.py
      - name: Reject HTTP discovery path spoofing in WebSocket request headers
        run: timeout 45s python3 scripts/verify_cdp_exact_http_route.py
      - name: Exercise native loopback CDP WebSocket and bearer enforcement
        run: python3 scripts/verify_cdp_websocket_smoke.py
      - name: Reject oversized inbound CDP WebSocket requests without consuming payloads
        run: timeout 45s python3 scripts/verify_cdp_ws_frame_budget.py
      - name: Refuse insecure CDP listener startup before binding
        run: python3 scripts/verify_cdp_startup_security.py
      - name: Verify trusted about-blank CDP page lifecycle and V8 expression
        run: python3 scripts/verify_cdp_js_loopback_smoke.py
      - name: Verify owned HTTP page with explicit local-only network opt-in
        run: python3 scripts/verify_cdp_owned_dom_smoke.py
